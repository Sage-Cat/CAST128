name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt build tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y qtbase5-dev

      - name: Test cipher core
        run: make test

      - name: Build Qt application
        working-directory: CAST128_Example
        run: qmake CAST128_Example.pro && make -j2
